version: '3.8'
services:
  # ========== 基础设施 ==========
  mysql:
    image: mysql:8.0
    container_name: task_mysql
    restart: unless-stopped
    environment:
      # 引用 .env 中的变量
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: task_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========== 应用服务 ==========
  user:
    build:
      context: .
      target: user
    container_name: task_user
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      APP_SERVER_HOST: "0.0.0.0"
      APP_SERVER_PORT: "8091"
      APP_SERVER_MODE: "release"
      APP_DATABASE_HOST: mysql
      APP_DATABASE_PORT: "3306"
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    container_name: task_worker
    restart: unless-stopped
    environment:
      APP_DATABASE_HOST: mysql
      APP_DATABASE_PORT: "3306"
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
